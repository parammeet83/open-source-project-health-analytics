[alembic]
# Developer convenience for the `alembic` command run from backend/. The `oss-health db upgrade`
# CLI does not read this file; it uses oss_health.migrate.alembic_config() instead.
script_location = %(here)s/src/oss_health/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# The database URL is never stored here. env.py reads MIGRATION_DATABASE_URL.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
