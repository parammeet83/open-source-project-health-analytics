[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-health"
version = "1.0.0"
description = "Open-Source Project Health Analytics: GitHub data pipeline and read-only analytics API"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "parammeet83" }]
dependencies = [
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<3.4",
]

[project.optional-dependencies]
pipeline = [
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pandera>=0.20,<1",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<8",
    "responses>=0.25,<1",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "pip-audit>=2.7,<3",
]

[project.scripts]
oss-health = "oss_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oss_health = ["sql/*.sql", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "B017", "E501"]
"migrations/**" = ["E501"]
"src/oss_health/api/queries.py" = ["E501"]  # long SQL text lines

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a dedicated PostgreSQL test database (TEST_DATABASE_URL)",
    "live: calls the real GitHub API; never run in CI",
]
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
    # Third-party notice emitted by fastapi.testclient itself; not actionable in this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["oss_health"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
