name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, audit, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: osp_health_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI-only database inside the job's service container.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/osp_health_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[pipeline,api,dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Dependency audit
        run: pip-audit --skip-editable --progress-spinner off
      - name: Configuration check (no token, no database)
        run: oss-health check-config
      - name: Migrations apply cleanly (fresh database, then idempotent re-run)
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          oss-health db upgrade
          oss-health db upgrade
      - name: Tests (unit + integration) with coverage gate
        run: pytest -q --cov=oss_health --cov-report=term --cov-fail-under=85
      - name: Installed-package smoke test (same non-editable install as deploy/ingest)
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/python -m pip install --quiet ".[pipeline]"
          /tmp/installed/bin/oss-health db upgrade
          /tmp/installed/bin/oss-health check-config

  api-entrypoint:
    name: Vercel API entrypoint (core dependencies only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly what Vercel installs (pyproject core dependencies)
        run: python -m pip install . "httpx>=0.27,<1"
      - name: Import backend/index.py and serve requests
        run: |
          python - <<'PY'
          import importlib.util, runpy
          for heavy in ("pandas", "pandera", "alembic", "uvicorn"):
              assert importlib.util.find_spec(heavy) is None, f"{heavy} must not be needed by the API"
          app = runpy.run_path("index.py")["app"]
          from fastapi.testclient import TestClient
          c = TestClient(app, raise_server_exceptions=False)
          assert c.get("/health/live").json() == {"status": "ok"}
          assert c.get("/health/ready").status_code == 503  # no database configured in CI
          assert c.post("/api/v1/runs").status_code == 405
          print("Vercel entrypoint OK")
          PY

  frontend:
    name: Frontend (types, tests, build, bundle scan, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        env:
          VITE_API_BASE_URL: https://ci-placeholder.example.vercel.app
        run: npm run build
      - name: Bundle contains no secrets or localhost API URLs
        env:
          VITE_API_BASE_URL: https://ci-placeholder.example.vercel.app
        run: npm run check:dist
      - run: npm audit --omit=dev --audit-level=moderate

  hygiene:
    name: Secret scan and whitespace check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - name: git diff --check (whole tree)
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
