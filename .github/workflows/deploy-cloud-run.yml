name: Migrate and deploy API

# Order: 1) apply Alembic migrations to Neon with the migration credential, 2) build the API
# image on the runner, push it to Artifact Registry, deploy to Cloud Run, 3) smoke-test the URL.
# Authentication to Google uses Workload Identity Federation (OIDC); no JSON key exists.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/src/**" # includes the packaged migrations (backend/src/oss_health/migrations)
      - "backend/pyproject.toml"
      - "backend/Dockerfile"
      - ".github/workflows/deploy-cloud-run.yml"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE: oss-health-api
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REPOSITORY: oss-health

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install ".[pipeline]"
      - name: Validate migration URL (secret-safe; prints yes/no flags only)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: oss-health db check-url --env MIGRATION_DATABASE_URL
      - name: Apply migrations (schema owner credential)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: oss-health db upgrade
      - name: Verify runtime role privileges
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: oss-health db verify-roles

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        env:
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CORS_ALLOW_ORIGIN_REGEX: ${{ vars.CORS_ALLOW_ORIGIN_REGEX }}
        run: |
          printf 'CORS_ALLOWED_ORIGINS: "%s"\nCORS_ALLOW_ORIGIN_REGEX: "%s"\nRATE_LIMIT_PER_MINUTE: "120"\nSTALE_AFTER_HOURS: "36"\n' \
            "$CORS_ALLOWED_ORIGINS" "$CORS_ALLOW_ORIGIN_REGEX" > /tmp/env.yaml
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --set-secrets "API_DATABASE_URL=oss-health-api-database-url:latest" \
            --env-vars-file /tmp/env.yaml \
            --port 8080 --cpu 1 --memory 512Mi --concurrency 40 \
            --min-instances 0 --max-instances 3 --timeout 30 \
            --cpu-throttling --quiet
      - name: Smoke test the public URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          echo "Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/health/live"
          curl -fsS "$URL/health/ready"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/runs")
          test "$code" = "405"
